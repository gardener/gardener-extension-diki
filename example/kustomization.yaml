apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- extension.yaml

patches:
- patch: |
    - op: replace
      path: /spec/deployment/extension/helm/ociRepository/ref
      value: local-skaffold/gardener-extension-diki/charts/extension
    - op: add
      path: /spec/deployment/extension/helm/ociRepository/caBundleSecretRef
      value:
        name: gardener-local-registry-ca
  target:
    group: operator.gardener.cloud
    kind: Extension
    name: extension-diki
