---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gardener-extension-diki
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gardener-extension-diki
    helm.sh/chart: gardener-extension-diki
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - update
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - {{ include "leaderelection.id" . }}
  - gardener-extension-heartbeat
  verbs:
  - get
  - update
  - patch
